<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 건강조사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F1DC;
    --card: #FFFFFF;
    --ink: #1E2A3A;
    --ink-soft: #6B6456;
    --ink-faint: #9C9484;
    --accent: #E3A63C;
    --pill-blue-bg: #C7E3ED;
    --pill-blue-ink: #1C4E63;
    --khaki: #D9C9A0;
    --khaki-ink: #3B3324;
    --khaki-disabled: #ECE4CF;
    --khaki-disabled-ink: #B4A98C;
    --border: #ECE3C8;
    --border-strong: #17140F;
    --danger: #B5473E;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-pill: 999px;
    --shadow: 0 6px 24px rgba(30, 42, 58, 0.08);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* 상단 바 */
  .topbar {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow);
    padding: 12px 12px 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .topbar-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 16px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }

  .pill {
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-pill);
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .pill:active { transform: scale(0.97); }

  .pill-blue {
    background: var(--pill-blue-bg);
    color: var(--pill-blue-ink);
    padding: 10px 18px;
    font-size: 14px;
  }

  /* 히어로 영역 */
  .hero { margin: 32px 4px 24px; }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--pill-blue-ink);
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .breadcrumb .spark { color: var(--accent); font-size: 14px; }

  h1 {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.35;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.6;
  }

  .info-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .info-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .info-item:last-child { margin-bottom: 0; }
  .info-item .mark { color: var(--accent); font-weight: 700; flex: none; }
  .info-item .info-label { font-weight: 600; color: var(--ink); flex: none; }

  /* 카드 */
  .card {
    background: var(--card);
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 26px 24px;
  }

  .card.hidden { display: none; }

  .field { margin-bottom: 18px; }
  .field:last-of-type { margin-bottom: 0; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .field select,
  .field input,
  .q-select,
  .q-textarea,
  .q-input {
    width: 100%;
    padding: 13px 16px;
    border-radius: var(--radius-md);
    border: 2px solid var(--border-strong);
    background: #FDFBF4;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
  }

  .field select,
  .q-select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path d='M4 6l4 4 4-4' stroke='%236B6456' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 40px;
  }

  .q-textarea { resize: vertical; }

  .q-notice {
    background: #FDF6E8;
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink);
  }
  .q-notice ul { margin: 0; padding-left: 18px; }
  .q-notice li { margin-bottom: 8px; }
  .q-notice li:last-child { margin-bottom: 0; }
  .q-notice strong { font-weight: 700; }

  .field select:focus,
  .field input:focus,
  .q-select:focus,
  .q-textarea:focus,
  .q-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .question.field-error .q-label { color: var(--danger); }
  .question.field-error .q-input,
  .question.field-error .q-select,
  .question.field-error .q-textarea,
  .question.field-error .option-item {
    border-color: var(--danger);
  }

  .field select:disabled,
  .field input:disabled {
    color: var(--ink-faint);
    background: #F4F0E4;
    cursor: not-allowed;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  .pill-khaki {
    flex: 1;
    padding: 14px 10px;
    font-size: 14px;
    background: var(--khaki);
    color: var(--khaki-ink);
    white-space: nowrap;
  }
  .pill-khaki:disabled {
    background: var(--khaki-disabled);
    color: var(--khaki-disabled-ink);
    cursor: not-allowed;
  }

  .error {
    color: var(--danger);
    font-size: 13px;
    margin: 14px 0 0;
    line-height: 1.5;
  }
  .error:empty { display: none; }

  .back-link {
    display: inline-block;
    margin-bottom: 16px;
    font-size: 13px;
    color: var(--ink-soft);
    text-decoration: none;
    cursor: pointer;
  }
  .back-link:hover { color: var(--ink); }

  /* 설문 화면 */
  .progress {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }

  .section-title {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 6px;
  }

  .section-desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 20px;
  }

  .question { margin-bottom: 22px; }
  .question:last-child { margin-bottom: 0; }

  .q-label {
    font-size: 14.5px;
    font-weight: 600;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .q-required { color: var(--danger); margin-left: 3px; }

  .option-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border: 2px solid var(--border-strong);
    border-radius: var(--radius-md);
    font-size: 14.5px;
    cursor: pointer;
  }
  .option-item input { flex: none; width: 17px; height: 17px; accent-color: var(--accent); }
  .option-item.checked { border-color: var(--accent); background: #FDF6E8; }

  /* 체크된 옵션 바로 아래에 이어지는 세부 입력 문항 */
  .nested-question {
    margin: -2px 0 0 18px;
    padding: 12px 14px;
    border: 2px dashed var(--border-strong);
    border-top: none;
    border-radius: 0 0 var(--radius-md) var(--radius-md);
    background: #FBF7EA;
  }
  .nested-question .q-label { margin-bottom: 8px; font-size: 13.5px; }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 26px;
  }
  .pill-outline {
    flex: none;
    padding: 14px 20px;
    font-size: 14px;
    background: #FFFFFF;
    border: 2px solid var(--border-strong);
    color: var(--ink-soft);
  }

  /* 완료/미제출자 화면 */
  .done-icon { font-size: 40px; margin-bottom: 10px; }
  .done-title { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
  .done-desc { font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin: 0; }

  table.unsub {
    width: 100%;
    border-collapse: collapse;
    margin-top: 18px;
    font-size: 14.5px;
  }
  table.unsub th, table.unsub td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.unsub th { color: var(--ink-soft); font-weight: 600; font-size: 12.5px; }

  .empty-note {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 24px 0;
  }
</style>
</head>
<body>

<div class="page">
  <div class="topbar">
    <div class="topbar-title"><span class="dot"></span> 학생 건강조사</div>
    <button class="pill pill-blue" onclick="alert('관리자 페이지는 별도 주소로 준비 중입니다.')">관리자</button>
  </div>

  <div class="hero">
    <div class="breadcrumb"><span class="spark">✦</span> <span id="schoolLine">보건실 안내</span></div>
    <h1 id="pageTitle">학생 건강조사</h1>
    <ul class="info-list" id="infoList"></ul>
  </div>

  <!-- 1. 학생 인증 화면 -->
  <div class="card" id="authCard">
    <div class="field">
      <label>학년</label>
      <select id="gradeSelect">
        <option value="">학년 선택</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
      </select>
    </div>
    <div class="field">
      <label>반</label>
      <select id="classSelect" disabled>
        <option value="">학년을 먼저 선택하세요</option>
      </select>
    </div>
    <div class="field">
      <label>번호</label>
      <input id="numberInput" type="number" min="1" placeholder="예: 5" disabled>
    </div>
    <div class="field">
      <label>이름</label>
      <input id="nameInput" type="text" placeholder="예: 홍길동" disabled>
    </div>

    <div class="btn-row">
      <button class="pill pill-khaki" id="startSurveyBtn" disabled>건강조사 참여하기 →</button>
      <button class="pill pill-khaki" id="checkUnsubmittedBtn" disabled>미제출자 조회 →</button>
    </div>
    <p class="error" id="authError"></p>
  </div>

  <!-- 2. 설문 화면 -->
  <div class="card hidden" id="surveyCard">
    <a class="back-link" id="surveyBackLink">← 처음으로</a>
    <div class="progress" id="surveyProgress"></div>
    <h2 class="section-title" id="sectionTitle"></h2>
    <p class="section-desc" id="sectionDesc"></p>
    <div id="questionList"></div>
    <div class="nav-row">
      <button class="pill pill-outline" id="prevBtn">이전</button>
      <button class="pill pill-khaki" id="nextBtn" style="flex:1;">다음 →</button>
    </div>
  </div>

  <!-- 3. 제출 완료 화면 -->
  <div class="card hidden" id="doneCard" style="text-align:center;">
    <div class="done-icon">🌤️</div>
    <p class="done-title">제출이 완료되었습니다</p>
    <p class="done-desc">응답해 주셔서 감사합니다.<br>추가로 알릴 사항이 있으면 보건실로 연락 주세요.</p>
    <div class="btn-row">
      <button class="pill pill-khaki" style="flex:1;" onclick="location.reload()">처음으로</button>
    </div>
  </div>

  <!-- 4. 미제출자 조회 화면 -->
  <div class="card hidden" id="unsubCard">
    <a class="back-link" id="unsubBackLink">← 처음으로</a>
    <div class="field">
      <label>조회 대상</label>
      <select id="formTypeSelect">
        <option value="survey">학생 건강조사</option>
        <option value="emergency_care">응급처치 동의서</option>
        <option value="health_log_use">온라인보건일지 동의서</option>
      </select>
    </div>
    <div class="btn-row">
      <button class="pill pill-khaki" style="flex:1;" id="fetchUnsubBtn">조회하기 →</button>
    </div>
    <div id="unsubResult"></div>
  </div>
</div>

<script>
/* ==========================================================
   설정
   - API_BASE_URL 을 배포한 Apps Script 웹 앱 URL로 바꾸면 실제
     구글시트와 연동됩니다. 비워두면 데모 데이터로 동작합니다
     (박보건/김보건/이보건 예시 — health-survey-setup.gs와 동일).
   ========================================================== */
const CONFIG = {
  API_BASE_URL: 'https://script.google.com/macros/s/AKfycbxu1Rt9GVQzIsYaB6evwX3oj-99stHvm7eBa0I332E7kI0E_jgG7LYjtGopVqgTlKk/exec', // 예: 'https://script.google.com/macros/s/XXXXXXXX/exec'
  MAX_CLASS: 10
};
const DEMO_MODE = !CONFIG.API_BASE_URL;

  },
  questions: [
    {section_no:2, section_title:'연락처 수집', section_desc:'해당 연락처는 응급상황 시에만 사용되며 1년 보유 후 완전 폐기합니다.', q_id:'q1', q_type:'text', q_label:'학생 본인의 연락처를 정확하게 적어주세요.', q_placeholder:'010-1234-1234', required:true, options:[], show_if:'', q_format:'phone'},
    {section_no:2, section_title:'', section_desc:'', q_id:'q2', q_type:'dropdown', q_label:'연락 가능한 보호자와의 관계', q_placeholder:'', required:true, options:['부','모','조부모','기타'], show_if:''},
    {section_no:2, section_title:'', section_desc:'', q_id:'q3', q_type:'text', q_label:'보호자의 연락처를 정확하게 적어주세요.', q_placeholder:'010-1234-1234', required:true, options:[], show_if:'', q_format:'phone'},
    {section_no:3, section_title:'현재 가지고 있는 질병에 관한 조사', section_desc:'', q_id:'q10', q_type:'radio', q_label:'현재 병원에서 진단 받아 치료 중이거나 관리 중인 질병이 있으신가요?', q_placeholder:'', required:true, options:['예','아니오'], show_if:''},
    {section_no:4, section_title:'현재 가지고 있는 질병에 대해 자세하게 적어주세요.', section_desc:'', q_id:'q11', q_type:'checkbox', q_label:'질환명(해당 항목 모두 선택)', q_placeholder:'', required:true, options:['제1형 당뇨','제2형 당뇨','성조숙증','우울증 등의 정서적 질환','천식','아토피','시력장애','청력장애','언어장애','지체장애','희귀난치성질환','기타'], show_if:'q10=예'},
    {section_no:4, section_title:'', section_desc:'', q_id:'q11_atopy_area', q_type:'text', q_label:'아토피 병변 부위', q_placeholder:'예: 팔 안쪽, 목, 무릎 뒤쪽 등', required:true, options:[], show_if:'q11=아토피'},
    {section_no:4, section_title:'', section_desc:'', q_id:'q11_atopy_severity', q_type:'radio', q_label:'증상의 중증도', q_placeholder:'', required:true, options:['상','중','하'], show_if:'q11=아토피'},
    {section_no:4, section_title:'', section_desc:'', q_id:'q11_emotion_detail', q_type:'text', q_label:'정서적 질환 세부 진단명', q_placeholder:'예: 우울증, 불안장애 등', required:true, options:[], show_if:'q11=우울증 등의 정서적 질환'},
    {section_no:4, section_title:'', section_desc:'', q_id:'q11_rare_detail', q_type:'text', q_label:'희귀난치성질환 세부 진단명', q_placeholder:'', required:true, options:[], show_if:'q11=희귀난치성질환'},

    {section_no:4, section_title:'', section_desc:'', q_id:'q15', q_type:'textarea', q_label:'현재 상태 및 학교생활 시 주의사항', q_placeholder:'', required:true, options:[], show_if:'q10=예'},
    {section_no:5, section_title:'알레르기 질환 관련 사항', section_desc:'', q_id:'q20', q_type:'radio', q_label:'가지고 있는 알레르기 질환이 있나요?', q_placeholder:'', required:true, options:['예','아니오'], show_if:''},
    {section_no:5, section_title:'', section_desc:'', q_id:'q21', q_type:'checkbox', q_label:'알레르기 유형(해당 항목 모두 선택)', q_placeholder:'', required:true, options:['식품','약물','동물','꽃가루','기타'], show_if:'q20=예'},
    {section_no:5, section_title:'', section_desc:'', q_id:'q21_food_detail', q_type:'text', q_label:'식품명', q_placeholder:'예: 새우, 우유, 땅콩 등', required:true, options:[], show_if:'q21=식품'},
    {section_no:5, section_title:'', section_desc:'', q_id:'q21_drug_detail', q_type:'text', q_label:'약품명', q_placeholder:'예: 페니실린 등', required:true, options:[], show_if:'q21=약물'},

  ],

    {grade:1, class:1, number:1, name:'박보건'},
    {grade:1, class:1, number:2, name:'김보건'},

  ],

/* 상태 */
let QUESTIONS = [];
let SECTION_LIST = [];
let currentSectionRealIndex = 0; // SECTION_LIST 안에서의 실제 인덱스 (표시 여부와 무관한 절대 위치)
let answers = {};
let student = { grade: '', class: '', number: '', name: '' };

/* API 호출 헬퍼 (데모/실서버 겸용) */
async function apiGet(action, params) {
  if (DEMO_MODE) return demoGet_(action, params);
  const qs = new URLSearchParams(Object.assign({ action }, params || {})).toString();
  const res = await fetch(`${CONFIG.API_BASE_URL}?${qs}`);
  return res.json();
}
async function apiPost(action, payload) {
  if (DEMO_MODE) return demoPost_(action, payload);
  const res = await fetch(CONFIG.API_BASE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action }, payload))
  });
  return res.json();
}

function demoGet_(action, params) {
  if (action === 'init') return { ok: true, config: DEMO.config, questions: DEMO.questions };
  if (action === 'unsubmitted') {
    const key = `${params.grade}-${params.class}`;
    const submitted = (params.formType === 'survey' || !params.formType)
      ? (DEMO.submittedSurveyNumbers[key] || [])
      : [];
    const roster = DEMO.roster.filter(r => String(r.grade) === params.grade && String(r.class) === params.class);
    const unsubmitted = roster.filter(r => submitted.indexOf(String(r.number)) === -1)
      .map(r => ({ number: r.number, name: r.name }));
    return { ok: true, unsubmitted };
  }
  return { ok: false, message: '알 수 없는 요청입니다.' };
}
function demoPost_(action, payload) {
  if (action === 'verifyStudent') {
    const match = DEMO.roster.find(r => String(r.grade) === String(payload.grade) &&
      String(r.class) === String(payload.class) && String(r.number) === String(payload.number) &&
      r.name === payload.name);
    return match ? { ok: true } : { ok: false, message: '(데모) 입력하신 정보와 일치하는 학생이 없습니다. 박보건/김보건/이보건(1학년 1반 1~3번)으로 시도해 보세요.' };
  }
  if (action === 'submitSurvey') {
    console.log('[데모 제출]', payload);
    return { ok: true, submission_id: 'DEMO-' + Date.now() };
  }
  return { ok: false, message: '알 수 없는 요청입니다.' };
}

/* 화면 전환 유틸 */
function showCard(id) {
  ['authCard','surveyCard','doneCard','unsubCard'].forEach(cid => {
    document.getElementById(cid).classList.toggle('hidden', cid !== id);
  });
}

/* 초기화 */
async function init() {
  const res = await apiGet('init', {});
  if (!res.ok) { alert('설문 정보를 불러오지 못했습니다.'); return; }

  document.getElementById('pageTitle').textContent = res.config.title || '학생 건강조사';
  renderInfoList_(res.config);

  QUESTIONS = res.questions;
  buildSectionList_();

  if (String(res.config.is_open) === 'FALSE') {
    document.getElementById('authCard').innerHTML =
      '<p class="empty-note">현재 건강조사 접수 기간이 아닙니다.</p>';
  }
}

function renderInfoList_(config) {
  const items = [
    { label: '제출기한', value: config.period },
    { label: '대상', value: config.target },
    { label: '안내', value: config.notice }
  ].filter(it => it.value);

  document.getElementById('infoList').innerHTML = items.map(it =>
    `<li class="info-item"><span class="mark">–</span><span class="info-label">${it.label}</span><span>${it.value}</span></li>`
  ).join('');
}

function buildSectionList_() {
  const map = {};
  let currentTitle = '', currentDesc = '';
  QUESTIONS.forEach(q => {
    if (q.section_title) currentTitle = q.section_title;
    if (q.section_desc) currentDesc = q.section_desc;
    if (!map[q.section_no]) {
      map[q.section_no] = { section_no: q.section_no, title: currentTitle, desc: currentDesc, questions: [] };
    }
    map[q.section_no].questions.push(q);
  });
  SECTION_LIST = Object.values(map).sort((a, b) => a.section_no - b.section_no);
}

/* 전화번호 입력 시 하이픈 자동 삽입 (010-1234-5678 형태로 고정) */
function formatPhone_(raw) {
  const digits = raw.replace(/[^0-9]/g, '').slice(0, 11);
  if (digits.length < 4) return digits;
  if (digits.length < 8) return digits.slice(0, 3) + '-' + digits.slice(3);
  return digits.slice(0, 3) + '-' + digits.slice(3, 7) + '-' + digits.slice(7);
}

/* show_if 평가 — "q11=지체장애" 처럼 단일 값, "q11=시력장애|청력장애" 처럼 |로 여러 값 지정 가능 */
function evalShowIf(showIf) {
  if (!showIf) return true;
  const [qId, valStr] = showIf.split('=');
  const values = valStr.split('|');
  const current = answers[qId];
  if (Array.isArray(current)) return values.some(v => current.indexOf(v) !== -1);
  return values.indexOf(String(current || '')) !== -1;
}

function showIfParentId_(showIf) {
  return showIf ? showIf.split('=')[0] : null;
}
function showIfValues_(showIf) {
  return showIf ? showIf.split('=')[1].split('|') : [];
}

function sectionGate_(section) {
  const qIds = section.questions.map(q => q.q_id);
  // 이 섹션의 문항이 참조하는 show_if 중, "같은 섹션 안의 다른 문항"이 아니라
  // "다른 섹션의 문항"을 가리키는 것만 진짜 섹션 표시 조건으로 인정한다.
  // (그렇지 않으면 예: 알레르기 섹션의 "기타 알레르기 유형(q21_etc)"이 같은 섹션의
  //  q21을 참조하는 것을, 섹션 전체를 여닫는 조건으로 잘못 오인해 섹션 자체가
  //  사라져버리는 문제가 있었음)
  const externalGate = section.questions.find(q => {
    const parentId = showIfParentId_(q.show_if);
    return parentId && qIds.indexOf(parentId) === -1;
  });
  return externalGate ? evalShowIf(externalGate.show_if) : true;
}

function computeVisibleSections_() {
  return SECTION_LIST.map((s, i) => i).filter(i => sectionGate_(SECTION_LIST[i]));
}

/* 학생 인증 폼 로직 */
const gradeSelect = document.getElementById('gradeSelect');
const classSelect = document.getElementById('classSelect');
const numberInput = document.getElementById('numberInput');
const nameInput = document.getElementById('nameInput');
const startSurveyBtn = document.getElementById('startSurveyBtn');
const checkUnsubmittedBtn = document.getElementById('checkUnsubmittedBtn');
const authError = document.getElementById('authError');

gradeSelect.addEventListener('change', () => {
  classSelect.innerHTML = '<option value="">반 선택</option>';
  if (gradeSelect.value) {
    for (let c = 1; c <= CONFIG.MAX_CLASS; c++) {
      classSelect.innerHTML += `<option value="${c}">${c}반</option>`;
    }
    classSelect.disabled = false;
  } else {
    classSelect.disabled = true;
    classSelect.innerHTML = '<option value="">학년을 먼저 선택하세요</option>';
  }
  numberInput.disabled = true; nameInput.disabled = true;
  numberInput.value = ''; nameInput.value = '';
  refreshButtons_();
});

classSelect.addEventListener('change', () => {
  const enabled = !!classSelect.value;
  numberInput.disabled = !enabled;
  nameInput.disabled = !enabled;
  refreshButtons_();
});

[numberInput, nameInput].forEach(el => el.addEventListener('input', refreshButtons_));

function refreshButtons_() {
  authError.textContent = '';
  checkUnsubmittedBtn.disabled = !(gradeSelect.value && classSelect.value);
  startSurveyBtn.disabled = !(gradeSelect.value && classSelect.value && numberInput.value && nameInput.value.trim());
}

startSurveyBtn.addEventListener('click', async () => {
  student = { grade: gradeSelect.value, class: classSelect.value, number: numberInput.value, name: nameInput.value.trim() };
  startSurveyBtn.disabled = true;
  startSurveyBtn.textContent = '확인 중…';
  const res = await apiPost('verifyStudent', student);
  startSurveyBtn.textContent = '건강조사 참여하기 →';
  refreshButtons_();
  if (!res.ok) { authError.textContent = res.message || '확인 중 오류가 발생했습니다.'; return; }

  answers = {};
  currentSectionRealIndex = computeVisibleSections_()[0];
  showCard('surveyCard');
  renderSection_();
});

checkUnsubmittedBtn.addEventListener('click', () => {
  showCard('unsubCard');
  document.getElementById('unsubResult').innerHTML = '';
  document.getElementById('unsubCard').dataset.grade = gradeSelect.value;
  document.getElementById('unsubCard').dataset.class = classSelect.value;
});

/* 설문 렌더링 */
const questionListEl = document.getElementById('questionList');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function renderSection_() {
  const section = SECTION_LIST[currentSectionRealIndex];
  const visible = computeVisibleSections_();
  const posInVisible = visible.indexOf(currentSectionRealIndex);

  document.getElementById('surveyProgress').textContent =
    `${posInVisible + 1} / ${visible.length} 섹션`;
  document.getElementById('sectionTitle').textContent = section.title;
  document.getElementById('sectionDesc').textContent = section.desc;

  questionListEl.innerHTML = '';
  section.questions.forEach(q => {
    if (!evalShowIf(q.show_if)) return;
    if (isChildQuestion_(q, section.questions)) return; // 부모 문항이 자기 아래에 직접 그려줌
    questionListEl.appendChild(renderQuestion_(q, section.questions));
  });

  prevBtn.style.visibility = posInVisible === 0 ? 'hidden' : 'visible';
  nextBtn.textContent = posInVisible === visible.length - 1 ? '제출하기' : '다음 →';
}

// q.show_if가 같은 섹션 안의 다른 문항을 가리키면 "자식 문항"으로 보고
// 부모 문항(체크박스/라디오) 아래에 직접 렌더링한다. (예: q11_etc → q11의 자식)
function isChildQuestion_(q, siblingQuestions) {
  const parentId = showIfParentId_(q.show_if);
  if (!parentId) return false;
  return siblingQuestions.some(sq => sq.q_id === parentId);
}
function findChildrenFor_(parentQId, siblingQuestions) {
  return siblingQuestions.filter(sq => showIfParentId_(sq.show_if) === parentQId);
}

// "흡연/음주 시작 학년"처럼 다른 답변(학교급)에 따라 선택지 개수가 달라지는 문항
const GRADE_DROPDOWN_PARENT = { q32: 'q31', q42: 'q41' };

function renderQuestion_(q, siblingQuestions) {
  const wrap = document.createElement('div');
  wrap.className = 'question';
  wrap.dataset.qid = q.q_id;
  const label = document.createElement('div');
  label.className = 'q-label';
  label.innerHTML = q.q_label + (q.required ? '<span class="q-required">*</span>' : '');
  wrap.appendChild(label);

  if (q.q_type === 'text' || q.q_type === 'number') {
    const input = document.createElement('input');
    input.className = 'q-input';
    input.placeholder = q.q_placeholder || '';
    input.value = answers[q.q_id] || '';
    if (q.q_format === 'phone') {
      input.type = 'tel';
      input.inputMode = 'numeric';
      input.maxLength = 13; // 010-1234-5678
      input.addEventListener('input', () => {
        // 하이픈을 직접 입력하다가 자동 포맷이 지워버려 커서가 끝으로 튀는
        // 문제가 있어, 포맷 전후 길이 차이만큼 커서 위치를 보정해준다.
        const cursorPos = input.selectionStart;
        const beforeLen = input.value.length;
        const formatted = formatPhone_(input.value);
        input.value = formatted;
        const newPos = Math.max(0, cursorPos + (formatted.length - beforeLen));
        input.setSelectionRange(newPos, newPos);
        answers[q.q_id] = formatted;
      });
    } else if (q.q_type === 'number') {
      // 네이티브 number 입력은 브라우저에 따라 값이 비정상적으로 비워지는 경우가 있어
      // text + 숫자 필터링 방식으로 안전하게 처리한다.
      input.type = 'text';
      input.inputMode = 'numeric';
      input.addEventListener('input', () => {
        input.value = input.value.replace(/[^0-9]/g, '');
        answers[q.q_id] = input.value;
      });
    } else {
      input.type = 'text';
      input.addEventListener('input', () => { answers[q.q_id] = input.value; });
    }
    wrap.appendChild(input);
  } else if (q.q_type === 'textarea') {
    const ta = document.createElement('textarea');
    ta.rows = 3;
    ta.className = 'q-textarea';
    ta.value = answers[q.q_id] || '';
    ta.addEventListener('input', () => { answers[q.q_id] = ta.value; });
    wrap.appendChild(ta);
  } else if (q.q_type === 'notice') {
    const notice = document.createElement('div');
    notice.className = 'q-notice';
    notice.innerHTML = q.q_placeholder || ''; // 관리자가 작성한 안내문(굵게/글머리기호 등 간단한 HTML 허용)
    wrap.appendChild(notice);
  } else if (q.q_type === 'dropdown') {
    let options = q.options;
    const parentId = GRADE_DROPDOWN_PARENT[q.q_id];
    if (parentId) {
      // 학교급이 "초등학교"면 1~6학년, 그 외(중/고등학교)는 1~3학년만 노출
      options = answers[parentId] === '초등학교' ? q.options.slice(0, 6) : q.options.slice(0, 3);
      if (answers[q.q_id] && options.indexOf(answers[q.q_id]) === -1) {
        answers[q.q_id] = ''; // 학교급이 바뀌어 더 이상 유효하지 않은 선택은 초기화
      }
    }
    const sel = document.createElement('select');
    sel.className = 'q-select';
    sel.innerHTML = '<option value="">선택</option>' + options.map(o => `<option value="${o}">${o}</option>`).join('');
    sel.value = answers[q.q_id] || '';
    sel.addEventListener('change', () => { answers[q.q_id] = sel.value; refreshVisibleFields_(); });
    wrap.appendChild(sel);
  } else if (q.q_type === 'radio' || q.q_type === 'checkbox') {
    const list = document.createElement('div');
    list.className = 'option-list';
    const current = answers[q.q_id] || (q.q_type === 'checkbox' ? [] : '');
    const children = findChildrenFor_(q.q_id, siblingQuestions);
    const renderedChildIds = new Set();

    q.options.forEach(opt => {
      const item = document.createElement('label');
      item.className = 'option-item';
      const checked = q.q_type === 'checkbox' ? current.indexOf(opt) !== -1 : current === opt;
      if (checked) item.classList.add('checked');
      item.innerHTML = `<input type="${q.q_type}" name="${q.q_id}" value="${opt}" ${checked ? 'checked' : ''}> ${opt}`;
      item.querySelector('input').addEventListener('change', () => {
        if (q.q_type === 'radio') {
          answers[q.q_id] = opt;
        } else {
          const arr = answers[q.q_id] || [];
          const idx = arr.indexOf(opt);
          if (idx === -1) arr.push(opt); else arr.splice(idx, 1);
          answers[q.q_id] = arr;
        }
        refreshVisibleFields_();
      });
      list.appendChild(item);

      // 이 옵션이 체크되어 있고, 이 옵션에 연결된 세부 입력 문항이 있다면
      // 바로 이 체크박스 아래에 이어서 그린다 (한 문항이 여러 옵션에 연결돼 있어도 한 번만).
      if (checked) {
        children
          .filter(child => showIfValues_(child.show_if).indexOf(opt) !== -1 && !renderedChildIds.has(child.q_id))
          .forEach(child => {
            renderedChildIds.add(child.q_id);
            const childWrap = renderQuestion_(child, siblingQuestions);
            childWrap.classList.add('nested-question');
            list.appendChild(childWrap);
          });
      }
    });
    wrap.appendChild(list);
  }
  return wrap;
}

function refreshVisibleFields_() {
  renderSection_();
}

function validateCurrentSection_() {
  const section = SECTION_LIST[currentSectionRealIndex];
  for (const q of section.questions) {
    if (!evalShowIf(q.show_if) || !q.required) continue;
    const v = answers[q.q_id];
    if (v === undefined || v === '' || (Array.isArray(v) && v.length === 0)) {
      return { qId: q.q_id, message: `"${q.q_label}" 항목은 필수 입력입니다.` };
    }
  }
  // 전화번호 형식 검증 (하이픈 포함 010-1234-5678 형태, 숫자 10~11자리)
  for (const q of section.questions) {
    if (q.q_format === 'phone' && answers[q.q_id]) {
      const digitCount = answers[q.q_id].replace(/[^0-9]/g, '').length;
      if (digitCount < 10 || digitCount > 11) {
        return { qId: q.q_id, message: `"${q.q_label}" 항목의 번호 자릿수를 다시 확인해 주세요. (010-1234-5678 형태)` };
      }
    }
  }
  return null;
}

function highlightFieldError_(qId) {
  questionListEl.querySelectorAll('.question.field-error').forEach(el => el.classList.remove('field-error'));
  const target = questionListEl.querySelector(`.question[data-qid="${qId}"]`);
  if (target) {
    target.classList.add('field-error');
    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

nextBtn.addEventListener('click', async () => {
  try {
    const err = validateCurrentSection_();
    if (err) { highlightFieldError_(err.qId); alert(err.message); return; }

    // 방금 입력한 답변을 반영해 "표시해야 할 다음 섹션"을 다시 계산한다.
    // (이전 코드는 이 섹션에 들어올 때 계산해둔 낡은 목록으로 판단해,
    //  이 섹션에서 방금 준 답변으로 새로 나타나야 할 다음 섹션을 놓치는 버그가 있었음)
    const visible = computeVisibleSections_();
    const nextRealIndex = visible.find(idx => idx > currentSectionRealIndex);

    if (nextRealIndex === undefined) {
      nextBtn.disabled = true;
      nextBtn.textContent = '제출 중…';
      const flatAnswers = {};
      Object.keys(answers).forEach(k => {
        flatAnswers[k] = Array.isArray(answers[k]) ? answers[k].join(',') : answers[k];
      });
      const res = await apiPost('submitSurvey', Object.assign({}, student, { answers: flatAnswers }));
      nextBtn.disabled = false;
      nextBtn.textContent = '제출하기';
      if (!res.ok) { alert(res.message || '제출 중 오류가 발생했습니다.'); return; }
      showCard('doneCard');
      return;
    }

    currentSectionRealIndex = nextRealIndex;
    renderSection_();
  } catch (e) {
    nextBtn.disabled = false;
    alert('예기치 못한 오류가 발생했습니다: ' + e.message);
    console.error(e);
  }
});

prevBtn.addEventListener('click', () => {
  const visible = computeVisibleSections_();
  const priorIndices = visible.filter(idx => idx < currentSectionRealIndex);
  if (priorIndices.length > 0) {
    currentSectionRealIndex = priorIndices[priorIndices.length - 1];
    renderSection_();
  }
});

document.getElementById('surveyBackLink').addEventListener('click', () => {
  if (confirm('처음으로 돌아가면 입력한 내용이 사라집니다. 계속할까요?')) location.reload();
});

/* 미제출자 조회 */
document.getElementById('unsubBackLink').addEventListener('click', () => showCard('authCard'));

document.getElementById('fetchUnsubBtn').addEventListener('click', async () => {
  const card = document.getElementById('unsubCard');
  const formType = document.getElementById('formTypeSelect').value;
  const res = await apiGet('unsubmitted', { grade: card.dataset.grade, class: card.dataset.class, formType });
  const resultEl = document.getElementById('unsubResult');
  if (!res.ok) { resultEl.innerHTML = `<p class="empty-note">${res.message}</p>`; return; }
  if (res.unsubmitted.length === 0) {
    resultEl.innerHTML = '<p class="empty-note">🎉 전원 제출 완료했습니다!</p>';
    return;
  }
  resultEl.innerHTML = `
    <table class="unsub">
      <thead><tr><th>번호</th><th>이름</th></tr></thead>
      <tbody>${res.unsubmitted.map(r => `<tr><td>${r.number}</td><td>${r.name}</td></tr>`).join('')}</tbody>
    </table>`;
});

init();
</script>
